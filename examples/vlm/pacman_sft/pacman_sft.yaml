experiment_name: pacman-vlm-sft
trial_name: ${oc.env:TRIAL_NAME,baseline}

seed: 1
enable_offload: false
total_train_epochs: 3
tokenizer_path: ${actor.path}

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: ${oc.env:AREAL_OUTPUT_ROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${cluster.fileroot}/name_resolve

actor:
  backend: ${oc.env:ACTOR_BACKEND,"fsdp:d8p1t1"}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${oc.env:MODEL_PATH}
  init_from_scratch: false
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 4096
  optimizer:
    type: adam
    lr: 2e-5
    weight_decay: 0.05
    beta1: 0.9
    beta2: 0.95
    eps: 1e-5
    lr_scheduler_type: cosine
    gradient_clipping: 1.0
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 32
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars: {}

train_dataset:
  path: ${oc.env:PACMAN_DATA_ROOT}
  type: sft
  split: train
  batch_size: 128
  shuffle: true
  pin_memory: true
  num_workers: 4
  scheduling_spec: null
  dataset_kwargs:
    split_modulus: 10
    validation_remainder: 0
    max_samples: null
    subset_seed: ${seed}
    shuffle_options: true
    shuffle_seed: ${seed}

valid_dataset:
  path: ${train_dataset.path}
  type: sft
  split: validation
  batch_size: 128
  shuffle: false
  pin_memory: true
  num_workers: 4
  scheduling_spec: null
  dataset_kwargs:
    split_modulus: 10
    validation_remainder: 0
    max_samples: null
    subset_seed: ${seed}
    shuffle_options: true
    shuffle_seed: ${seed}

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
