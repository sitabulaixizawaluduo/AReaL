experiment_name: playjev-pacman-agentic-h1
trial_name: qwen3_5_0_8b_8gpu

seed: 1
enable_offload: true
total_train_epochs: 1
total_train_steps: null
tokenizer_path: ${actor.path}

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: /tmp/areal/experiments
  name_resolve:
    type: nfs
    nfs_record_root: ${cluster.fileroot}/name_resolve

scheduler:
  type: local

rollout:
  backend: sglang:d8p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 32
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 1
  request_timeout: 600
  enable_rollout_tracing: false
  scheduling_strategy:
    type: colocation
    target: actor
    fork: true
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  agent:
    mode: inline
    tool_call_parser: qwen
    reasoning_parser: qwen3
    chat_template_type: concat
    chat_template_kwargs:
      enable_thinking: false
    export_style: concat
    turn_discount: 1.0

gconfig:
  n_samples: 8
  min_new_tokens: 1
  max_new_tokens: 1024
  greedy: false
  temperature: 1.0
  top_p: 1.0
  reward_normalization: false
  drop_incomplete_group: true

eval_gconfig:
  n_samples: 1
  min_new_tokens: 1
  max_new_tokens: ${gconfig.max_new_tokens}
  greedy: true
  temperature: 0.0
  top_p: 1.0
  reward_normalization: false
  drop_incomplete_group: false

actor:
  backend: megatron:d8p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3.5-0.8B
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: false
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 16384
  optimizer:
    type: adam
    lr: 1e-6
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.01
  eps_clip: 0.2
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    level: token
    action: mask
    metric: ratio
    upper: 5.0
  reward_norm:
    mean_level: group
    std_level: group
    group_size: ${gconfig.n_samples}
  adv_norm: null
  weight_update_mode: awex
  max_new_tokens: ${gconfig.max_new_tokens}
  megatron:
    bridge_type: megatron-bridge
    use_bridge_for_update_weights: true
    ddp:
      use_distributed_optimizer: true
      overlap_grad_reduce: false
      overlap_param_gather: false
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 32
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        PYTORCH_ALLOC_CONF: expandable_segments:True
        TMS_INIT_ENABLE: '0'
        TMS_INIT_ENABLE_CPU_BACKUP: '0'

ref: null

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: 32
  context_length: 8192
  mem_fraction_static: 0.75
  enable_multimodal: true

train_dataset:
  path: ./data/pacman_h1_experiment/train
  type: rl
  batch_size: 64
  shuffle: true
  pin_memory: true
  num_workers: 4
  drop_last: true

valid_dataset:
  path: ./data/pacman_h1_experiment/valid
  type: rl
  batch_size: 64
  shuffle: false
  pin_memory: true
  num_workers: 4
  drop_last: false

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 25
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 25
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 25
  freq_secs: null
  eval_before_train: true

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
